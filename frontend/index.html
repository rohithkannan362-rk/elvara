<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Website temporarily unavailable</title>
    <!-- TEMPORARY LOCK: the site is suspended until payment is complete.
         To restore the full site, revert the commit that added this page. -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b0b; }
      body {
        display: grid; place-items: center; padding: 16px; box-sizing: border-box;
        color: #f2f2f2; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center;
        user-select: none;
      }
      main { max-width: 560px; }
      .badge {
        display: inline-block; margin-bottom: 1.5rem; padding: 0.45rem 0.9rem; border-radius: 999px;
        font-size: 0.75rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
        color: #ffb4a8; background: rgba(255, 90, 70, 0.12); border: 1px solid rgba(255, 90, 70, 0.35);
      }
      h1 { margin: 0 0 1rem; font-size: clamp(1.8rem, 6vw, 3rem); line-height: 1.15; font-weight: 700; }
      p { margin: 0; font-size: clamp(1rem, 2.6vw, 1.15rem); line-height: 1.6; color: #b9b9b9; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Payment pending</span>
      <h1>This website is temporarily unavailable</h1>
      <p>Please complete the payment to use the website. Access will be restored once payment is received.</p>
    </main>
  </body>
</html>
