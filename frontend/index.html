<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELVARA — Material Innovation Showroom</title>
    <meta name="description" content="ELVARA turns agricultural waste into biodegradable packaging with a built-in natural freshness indicator. Explore the collection." />
    <meta name="theme-color" content="#02110c" />
    <link rel="icon" href="/media/logo.jpg" />
    <!-- The entrance shows before any script: its poster and logo are wanted first. -->
    <link rel="preload" href="/media/intro/enter-poster.jpg" as="image" fetchpriority="high" />
    <link rel="preload" href="/media/logo.jpg" as="image" />
    <!-- Foundry typefaces from the Indian Type Foundry (Fontshare, free for commercial use). -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=zodiak@300,301,400,401,500,501&f[]=author@300,400,500,600&display=swap" rel="stylesheet" />
    <!-- Entrance styles live here, so the opening renders on the very first paint.
         Every movement is a CSS animation or transition: the compositor runs them,
         so they stay smooth while the page's script loads and builds underneath. -->
    <style>
      html, body { margin: 0; background: #020a07; }
      #boot {
        position: fixed; inset: 0; z-index: 100; overflow: hidden; display: grid; place-items: center;
        color: #f3ebd6; background: #020a07; font-family: 'Author', system-ui, sans-serif;
      }
      #boot .loader__film {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        background: #0b1f15 url('/media/intro/enter-poster.jpg') center / cover no-repeat;
        transform: scale(1.02); transition: transform 1.1s cubic-bezier(0.6, 0, 0.4, 1);
      }
      #boot .loader__shade {
        position: absolute; inset: 0; pointer-events: none;
        background:
          radial-gradient(60% 55% at 50% 50%, rgba(2, 17, 12, 0.5) 0%, rgba(2, 17, 12, 0.18) 60%, transparent 100%),
          linear-gradient(180deg, rgba(2, 17, 12, 0.45) 0%, transparent 28%, transparent 70%, rgba(2, 17, 12, 0.6) 100%);
        transition: opacity 0.6s ease;
      }
      #boot .loader__flash {
        position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0;
        background: radial-gradient(circle at 62% 30%, #fff8e8 0%, #f3ebd6 40%, rgba(243, 235, 214, 0.92) 100%);
        transition: opacity 0.45s ease-in 0.2s;
      }
      #boot .loader__center {
        position: relative; z-index: 2; display: grid; justify-items: center; gap: 1.9rem; text-align: center;
        text-shadow: 0 2px 30px rgba(2, 10, 7, 0.75);
        transition: opacity 0.45s ease, transform 0.6s cubic-bezier(0.6, 0, 0.4, 1);
      }
      #boot .loader__center::before {
        content: ''; position: absolute; inset: -18% -30%; z-index: -1; border-radius: 50%; filter: blur(10px);
        background: radial-gradient(closest-side, rgba(2, 10, 7, 0.62), rgba(2, 10, 7, 0.3) 55%, transparent);
      }
      #boot .loader__mark {
        width: clamp(104px, 15vmin, 160px); aspect-ratio: 1; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
        background: #f7f2e6;
        box-shadow: 0 0 0 1px rgba(232, 215, 174, 0.6), 0 30px 80px -20px rgba(0, 0, 0, 0.8), 0 0 60px rgba(232, 215, 174, 0.25);
        animation: bootMark 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #boot .loader__mark img { width: 86%; height: 86%; object-fit: contain; mix-blend-mode: multiply; }
      /* Greeting: a quiet line that arrives just before the name. */
      #boot .loader__hello {
        margin: 0 0 -1.1rem; font: italic 300 clamp(1.05rem, 2vw, 1.45rem)/1 'Zodiak', Georgia, serif;
        letter-spacing: 0.06em; color: #e8d7ae; animation: bootHello 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both;
      }
      #boot .loader__word {
        margin: 0; font: 400 clamp(2.3rem, 6vw, 4.4rem)/1 'Zodiak', Georgia, serif;
        letter-spacing: 0.32em; padding-left: 0.32em; display: flex; overflow: hidden; padding-block: 0.1em;
      }
      #boot .loader__word span { display: inline-block; animation: bootRise 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }
      #boot .loader__word span:nth-child(1) { animation-delay: 0.25s; }
      #boot .loader__word span:nth-child(2) { animation-delay: 0.3s; }
      #boot .loader__word span:nth-child(3) { animation-delay: 0.35s; }
      #boot .loader__word span:nth-child(4) { animation-delay: 0.4s; }
      #boot .loader__word span:nth-child(5) { animation-delay: 0.45s; }
      #boot .loader__word span:nth-child(6) { animation-delay: 0.5s; }
      #boot .loader__motto {
        margin: -0.5rem 0 0; padding: 0 16px; font: 500 0.78rem/1.4 'Author', system-ui, sans-serif; letter-spacing: 0.3em;
        text-transform: uppercase; color: rgba(243, 235, 214, 0.86); animation: bootFade 0.8s ease 0.6s both;
      }
      #boot .loader__skip {
        position: absolute; z-index: 4; top: clamp(18px, 3.5vh, 32px); right: clamp(16px, 4vw, 56px);
        padding: 0.7rem 1.1rem; border-radius: 999px; cursor: pointer; font: 500 0.66rem/1 'Author', system-ui, sans-serif;
        letter-spacing: 0.22em; text-transform: uppercase; color: rgba(243, 235, 214, 0.85);
        background: rgba(2, 17, 12, 0.35); border: 1px solid rgba(243, 235, 214, 0.28);
        animation: bootFade 0.6s ease 0.4s both; transition: background 0.3s, border-color 0.3s;
      }
      #boot .loader__skip:hover { background: rgba(2, 17, 12, 0.6); border-color: rgba(243, 235, 214, 0.6); }
      /* Exit: the mark lifts away, the camera pushes on, light floods in, the page shows. */
      #boot.is-leaving .loader__center { opacity: 0; transform: translateY(-24px) scale(1.08); }
      #boot.is-leaving .loader__skip { opacity: 0; transition: opacity 0.3s; }
      #boot.is-leaving .loader__film { transform: scale(1.18); }
      #boot.is-leaving .loader__shade { opacity: 0; }
      #boot.is-leaving .loader__flash { opacity: 1; }
      #boot.is-gone { opacity: 0; visibility: hidden; transition: opacity 0.45s ease, visibility 0s linear 0.45s; }
      #boot.is-quick .loader__flash { transition-delay: 0s; }
      @keyframes bootMark { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: none; } }
      @keyframes bootRise { from { transform: translateY(110%); } to { transform: none; } }
      @keyframes bootFade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes bootHello { from { opacity: 0; transform: translateY(10px); letter-spacing: 0.3em; } to { opacity: 1; transform: none; letter-spacing: 0.06em; } }
      @media (max-width: 520px) { #boot .loader__motto { font-size: 0.66rem; letter-spacing: 0.2em; } }
      @media (prefers-reduced-motion: reduce) {
        #boot *, #boot { animation: none !important; transition-duration: 0.01s !important; transition-delay: 0s !important; }
      }
    </style>
  </head>
  <body>
    <!-- The entrance: plays the moment the page arrives; the app takes it over. -->
    <div id="boot" class="loader" role="status" aria-label="Entering ELVARA">
      <video class="loader__film" src="/media/intro/enter.mp4" poster="/media/intro/enter-poster.jpg" autoplay muted playsinline preload="auto" aria-hidden="true"></video>
      <span class="loader__shade" aria-hidden="true"></span>
      <span class="loader__flash" aria-hidden="true"></span>
      <div class="loader__center">
        <div class="loader__mark"><img src="/media/logo.jpg" alt="ELVARA logo" /></div>
        <p class="loader__hello">Welcome to</p>
        <h1 class="loader__word wordmark" aria-label="ELVARA"><span>E</span><span>L</span><span>V</span><span>A</span><span>R</span><span>A</span></h1>
        <p class="loader__motto">A cleaner tomorrow in your hands</p>
      </div>
      <button type="button" class="loader__skip">Skip intro</button>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
